name: Jackie · Indeed Watcher

on:
  schedule:
    # 5x/day, 7am-6pm Pacific (PDT). Hours chosen to avoid the other
    # scrapers' crons: they all share one concurrency group and GitHub
    # cancels the older pending run when a third queues. The watchdog
    # (linkedin_watch_backup.yml) re-dispatches a lost fire in the same hours.
    - cron: "35 16,19,21,23,2 * * *"
  workflow_dispatch:

concurrency:
  group: job-scraper-commit-push
  cancel-in-progress: false

jobs:
  scrape:
    name: Indeed scrape
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Indeed deps
        run: pip install -r requirements.txt

      - name: Scrape Indeed (last 24h)
        run: python scrape_jobs.py --indeed-only
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          NOTIFY_TERMS: ${{ vars.NOTIFY_TERMS }}

      - name: Record workflow run
        run: |
          python - <<'EOF'
          import json
          import os
          from datetime import datetime, timezone

          with open("indeed_jobs.json", encoding="utf-8") as f:
              data = json.load(f)

          entry = {
              "workflow": "indeed",
              "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "job_count": int(data.get("total", 0)),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
          }

          with open("workflow_runs.jsonl", "a", encoding="utf-8") as f:
              f.write(json.dumps(entry, sort_keys=True) + "\n")
          EOF

      - name: Commit results to repo
        run: |
          git config user.name  "ernestod1998"
          git config user.email "61074783+ernestod1998@users.noreply.github.com"
          python ci_commit_push.py \
            --message "chore: update indeed listings [$(date -u '+%Y-%m-%d %H:%MZ')]" \
            indeed_jobs.json indeed_jobs.md indeed_jobs.html \
            workflow_runs.jsonl all_jobs.json notified.json
